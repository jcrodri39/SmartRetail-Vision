{% extends "base.html" %}{% block content %}<span class="eyebrow">UC002</span><h1>Fuentes de video</h1><div class="grid"><section class="card"><h2>Registrar fuente</h2>
<form method="post"><label>Tienda</label><select name="id_tienda">{% for s in stores %}<option value="{{s.id_tienda}}">{{s.nombre}}</option>{% endfor %}</select>
<label>Nombre</label><input name="nombre" required><label>Fuente</label><input name="fuente" placeholder="0, ruta MP4 o RTSP" required><button>Guardar fuente</button></form>
<hr><h3>Subir video</h3><form method="post" action="/videos/upload" enctype="multipart/form-data"><select name="id_tienda">{% for s in stores %}<option value="{{s.id_tienda}}">{{s.nombre}}</option>{% endfor %}</select><input name="nombre" placeholder="Nombre" required><input type="file" name="video" accept="video/*" required><button class="secondary">Subir</button></form></section>
<section class="card"><h2>Fuentes configuradas</h2>{% for c in cameras %}<div class="row"><div><b>{{c.nombre}}</b><small>{{c.fuente}} · {{'Activa' if c.estado else 'Inactiva'}}</small></div><form method="post" action="/videos/{{c.id_camara}}/toggle"><button class="ghost">{{'Desactivar' if c.estado else 'Activar'}}</button></form></div>{% else %}<p class="muted">No hay fuentes.</p>{% endfor %}</section></div>{% endblock %}
