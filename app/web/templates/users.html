{% extends "base.html" %}{% block content %}<span class="eyebrow">UC008 · ADMIN</span><h1>Usuarios y roles</h1><div class="grid"><section class="card"><h2>Crear usuario</h2><form method="post"><label>Nombre</label><input name="nombre" required><label>Correo</label><input name="email" type="email" required><label>Contraseña</label><input name="password" type="password" minlength="8" required><label>Rol</label><select name="rol"><option>ANALYST</option><option>ADMIN</option></select><button>Crear usuario</button></form></section>
<section class="card"><h2>Usuarios</h2>{% for u in users %}<div class="row"><div><b>{{u.nombre}}</b><small>{{u.email}} · {{u.rol}} · {{'Activo' if u.estado else 'Inactivo'}}</small></div><div class="inline"><form method="post" action="/users/{{u.id_usuario}}/role"><select name="rol" onchange="this.form.submit()"><option {% if u.rol=='ANALYST' %}selected{% endif %}>ANALYST</option><option {% if u.rol=='ADMIN' %}selected{% endif %}>ADMIN</option></select></form><form method="post" action="/users/{{u.id_usuario}}/toggle"><button class="ghost">{{'Desactivar' if u.estado else 'Activar'}}</button></form></div></div>{% endfor %}</section></div>{% endblock %}
