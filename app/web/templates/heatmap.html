{% extends "base.html" %}{% block content %}<div class="head"><div><span class="eyebrow">UC006</span><h1>Mapa de calor</h1><p class="muted">Concentración espacial a partir de centroides YOLO almacenados.</p></div>
<form><select name="store_id" onchange="this.form.submit()">{% for s in stores %}<option value="{{s.id_tienda}}" {% if s.id_tienda==store_id %}selected{% endif %}>{{s.nombre}}</option>{% endfor %}</select><label for="processing_id">Sesión</label><select id="processing_id" name="processing_id"><option value="">Todas las sesiones (histórico)</option>{% for sess in sessions %}<option value="{{sess.id_procesamiento}}" {% if sess.id_procesamiento==processing_id %}selected{% endif %}>Sesión #{{sess.id_procesamiento}} · {{sess.estado}}</option>{% endfor %}</select><button type="submit">Aplicar filtros</button></form></div>
<section class="card"><canvas id="heat" width="1000" height="560"></canvas><div class="legend">Baja concentración ━━━━━━━━━ Alta concentración</div></section>
<script>const pts={{points|tojson}};const c=heat,ctx=c.getContext('2d');ctx.fillStyle='#e9eef2';ctx.fillRect(0,0,c.width,c.height);if(pts.length){let mx=Math.max(...pts.map(p=>p[0]),1),my=Math.max(...pts.map(p=>p[1]),1);for(const p of pts){let x=p[0]/mx*c.width,y=p[1]/my*c.height,g=ctx.createRadialGradient(x,y,2,x,y,35);g.addColorStop(0,'rgba(235,55,55,.35)');g.addColorStop(1,'rgba(255,180,0,0)');ctx.fillStyle=g;ctx.fillRect(x-35,y-35,70,70)}}</script>{% endblock %}
